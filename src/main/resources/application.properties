spring.application.name=autoloc-api
server.servlet.context-path=/api
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.autoloc=INFO

# Required application users; provide these values through environment variables.
APP_MANAGER_USERNAME=${APP_MANAGER_USERNAME}
APP_MANAGER_PASSWORD=${APP_MANAGER_PASSWORD}
APP_USER_USERNAME=${APP_USER_USERNAME}
APP_USER_PASSWORD=${APP_USER_PASSWORD}